<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Ambiental OLED</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    .aurora-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000000;
      filter: blur(80px);
      opacity: 0.65;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
    }
    .blob1 {
      top: 15%; left: 20%;
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, #059669 0%, rgba(5,150,105,0) 70%);
      animation: drift1 24s infinite alternate ease-in-out;
    }
    .blob2 {
      bottom: 10%; right: 15%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, #4F46E5 0%, rgba(79,70,229,0) 70%);
      animation: drift2 30s infinite alternate ease-in-out;
    }
    .blob3 {
      top: 40%; right: 35%;
      width: 40vw; height: 40vw;
      background: radial-gradient(circle, #0284C7 0%, rgba(2,132,199,0) 70%);
      animation: drift3 26s infinite alternate ease-in-out;
    }
    @keyframes drift1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(12vw, 15vh) scale(1.15); }
      100% { transform: translate(-8vw, 8vh) scale(0.95); }
    }
    @keyframes drift2 {
      0% { transform: translate(0, 0) scale(1.1); }
      50% { transform: translate(-15vw, -12vh) scale(0.9); }
      100% { transform: translate(10vw, -6vh) scale(1.05); }
    }
    @keyframes drift3 {
      0% { transform: translate(0, 0) scale(0.9); }
      50% { transform: translate(-10vw, 12vh) scale(1.2); }
      100% { transform: translate(14vw, -10vh) scale(1); }
    }
  </style>
</head>
<body>
  <div class="aurora-wrap">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>
</body>
</html>
