<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ondas Nocturnas OLED</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="waves"></canvas>

  <script>
    const canvas = document.getElementById('waves');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let step = 0;
    const waves = [
      { length: 0.003, amplitude: 55, speed: 0.012, color: 'rgba(30, 58, 138, 0.45)' },
      { length: 0.004, amplitude: 45, speed: 0.008, color: 'rgba(13, 148, 136, 0.35)' },
      { length: 0.002, amplitude: 65, speed: 0.015, color: 'rgba(79, 70, 229, 0.30)' }
    ];

    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      step += 1;
      const baseHeight = h * 0.65;

      waves.forEach((wv, idx) => {
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(0, baseHeight);

        for (let x = 0; x <= w; x += 6) {
          const y = baseHeight +
            Math.sin(x * wv.length + step * wv.speed) * wv.amplitude +
            Math.cos((x + step * 2) * 0.002) * (wv.amplitude * 0.3);
          ctx.lineTo(x, y);
        }

        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fillStyle = wv.color;
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
